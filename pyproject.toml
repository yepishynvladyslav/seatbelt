[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "seatbelt-agent"
version = "0.3.0"
description = "A safety layer for AI coding agents: blocks catastrophic shell commands, asks before irreversible ones, logs everything."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
keywords = ["ai", "agents", "claude-code", "safety", "security", "hooks"]

[project.scripts]
seatbelt = "seatbelt:main"

[tool.setuptools]
py-modules = ["seatbelt"]
